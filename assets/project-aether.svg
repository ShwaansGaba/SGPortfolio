<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="luminaBg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050a16"/>
    </linearGradient>
    <linearGradient id="waveNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#luminaBg)"/>

  <!-- Architectural Section Lines -->
  <g stroke="#253556" stroke-width="1.2" opacity="0.6">
    <line x1="200" y1="160" x2="1400" y2="160"/>
    <line x1="200" y1="840" x2="1400" y2="840"/>
    <line x1="200" y1="160" x2="200" y2="840"/>
    <line x1="1400" y1="160" x2="1400" y2="840"/>
    <line x1="800" y1="160" x2="800" y2="840" stroke-dasharray="6 6"/>
  </g>

  <!-- Sound Stage Acoustic Volume: Architectural Elevation Curves -->
  <g transform="translate(800, 500)">
    <!-- Concentric Acoustic Propagation Arcs -->
    <circle cx="0" cy="0" r="100" stroke="#1d2f52" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="180" stroke="#253b66" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="260" stroke="#324d80" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="340" stroke="#41649f" stroke-width="1" stroke-dasharray="4 6" fill="none"/>
    <circle cx="0" cy="0" r="420" stroke="#5b82c2" stroke-width="1" stroke-dasharray="2 4" fill="none"/>

    <!-- Geometric Acoustic Reflection Prisms -->
    <path d="M -240 -140 L 0 -220 L 240 -140 L 160 140 L -160 140 Z" fill="#0d1b38" stroke="url(#waveNavy)" stroke-width="2" opacity="0.85"/>
    <line x1="0" y1="-220" x2="0" y2="140" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>

    <!-- Focal Source Point -->
    <circle cx="0" cy="0" r="8" fill="#93c5fd"/>
    <circle cx="0" cy="0" r="24" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Editorial Metadata Annotations -->
  <text x="240" y="210" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="3" text-transform="uppercase">ACOUSTIC CHAMBER A04</text>
  <text x="240" y="235" fill="#f8fafc" font-family="'Playfair Display', serif" font-size="28" font-weight="500">Volumetric Sound Attenuation</text>
  <text x="1180" y="210" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="2">ZURICH, SWITZERLAND</text>
  <text x="1180" y="235" fill="#93c5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">RT60: 0.84 SECONDS</text>
</svg>
